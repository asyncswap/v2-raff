name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Huff Neo Compiler release that builds src/.
  HNC_VERSION: v1.6.2

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.6

      - name: Install Huff Neo
        run: |
          mkdir -p "$HOME/.huff-neo/bin"
          curl -sSfL "https://github.com/cakevm/huff-neo/releases/download/${HNC_VERSION}/hnc-${HNC_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.huff-neo/bin"
          echo "$HOME/.huff-neo/bin" >> "$GITHUB_PATH"

      - name: Show versions
        run: |
          forge --version
          hnc --version

      - name: Install Soldeer dependencies
        run: forge soldeer install

      # The hook's constructor deploys the FeeVault from this generated creation code.
      - name: Check generated Huff is current
        run: |
          ./script/huff-codegen.sh
          git diff --exit-code src/generated

      - name: Run Forge fmt
        run: forge fmt --check

      # asyncswap/contracts' suite, deploying the Huff in src/; the invariant suites at the depth
      # asyncswap/contracts' CI uses. test/huff/CodeSize.t.sol keeps the Huff runtimes under EIP-170.
      - name: Run Forge tests
        env:
          FOUNDRY_INVARIANT_RUNS: "64"
          FOUNDRY_INVARIANT_DEPTH: "64"
          # The Unichain fork tests run against live mainnet state at a pinned block.
          UNICHAIN_FORK_RPC_URL: https://mainnet.unichain.org
          UNICHAIN_FORK_BLOCK: "61709000"
        run: forge test -vvv

      - name: Checkout pinned Solidity acceptance source
        uses: actions/checkout@v5
        with:
          repository: asyncswap/contracts
          ref: 3f4a5f106f55cc4b90b11d0ce0f0143f5e64ed89
          path: .local/contracts-reference
          persist-credentials: false

      - name: Check copied tests and adapters are unchanged
        run: python3 script/sync-current-tests.py .local/contracts-reference --check

      - name: Run current Huff acceptance tests
        env:
          FOUNDRY_PROFILE: current
          FOUNDRY_INVARIANT_RUNS: "64"
          FOUNDRY_INVARIANT_DEPTH: "64"
          UNICHAIN_FORK_RPC_URL: https://mainnet.unichain.org
          UNICHAIN_FORK_BLOCK: "61709000"
        run: forge test -vvv

      - name: Run extended matching and formal parity tests
        env:
          FOUNDRY_PROFILE: current
        run: >-
          forge test
          --match-contract '.*(Reference|Funding|Transitions|TopUp|MatchAmountsFormal|MatchPairFormal|ReduceAfterMatchFormal|ReduceMatchedOrdersFormal|SettleMatchedPriorityFeeFormal|FreeNodeFormal|RemoveFormal|BestOrderFormal|CrossesFormal|PriorityKeyFormal|SpecSigFormal|TickBitmap|TickPricePoolBeatsLevel).*'
          --fuzz-runs 2048
          --fuzz-seed 0x3fc1525e14690ecb57279377f4de44dc8ff0715e96573f69331aaab403047456
          -vvv

      - name: Check current sizes, signature memory and pool-price parity
        env:
          FOUNDRY_PROFILE: current
          FOUNDRY_TEST: compat/current/checks
        run: forge test --fuzz-runs 4096 -vvv

[profile.default]
src = "src"
out = "out"
libs = ["dependencies", "lib"]
# `src/` is the Huff, compiled by `hnc` through `vm.ffi` (foundry-huff-neo), and `src/interface/` the
# Solidity interfaces the tests (asyncswap/contracts' suite) call it through.
ffi = true
fs_permissions = [
  { access = "read", path = "./broadcast/" },
  { access = "read-write", path = "./deployments/" },
]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 1_000

[lint]
lint_on_build = false

[dependencies]
forge-std = "1.16.0"
uniswap-v4-core = "4"
solmate = "6.8.0"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

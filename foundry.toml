[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# The Huff contracts are compiled by `hnc` through `vm.ffi` (foundry-huff-neo).
ffi = true
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
    "forge-std/=lib/forge-std/src/",
    "foundry-huff-neo/=lib/foundry-huff-neo/src/",
    "v4-core/=lib/v4-periphery/lib/v4-core/src/",
    "v4-core-test/=lib/v4-periphery/lib/v4-core/test/",
    "@openzeppelin/contracts/=lib/v4-periphery/lib/v4-core/lib/openzeppelin-contracts/contracts/",
    "solmate/=lib/v4-periphery/lib/v4-core/lib/solmate/",
]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 32
depth = 48
fail_on_revert = false

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
